['奶茶店',[['春水堂（珍奶創始）','春水堂 信義區 台北','',1],['50嵐','50嵐 台北',''],['soma（點高山青茶歐蕾）','soma 永康街 東門站','東門站（19 日），永康街第一個路口對面',1],['麥吉','麥吉 西門町','',1],['得正','得正 台北',''],['迷客夏','迷客夏 台北',''],['龜記','龜記 台北',''],['大茗','大茗本位製茶堂 台北',''],['可不可','可不可熟成紅茶 台北',''],['天仁','天仁茗茶 台北','']]],
['非必要',[['佳德糕餅（鳳梨酥）','佳德糕餅 南京東路五段88號','南京東路五段 88 號']]]];
const TP=['10/17（六）：前往大巨蛋與賽後返程人多，預留時間','機場捷運：泰山站為普通車，直達車不停；出發前查末班車，回泰山不要拖太晚','台北車站有投幣寄物櫃，可臨時寄放東西','週一（10/19）：許多博物館與展館休館，包括餐廳也可能公休，出發前確認','台灣出入境與購買電話卡可能需出示護照，隨身帶好','台北捷運禁止飲食，包括喝水也要避免','搭手扶梯靠右站，左側留給趕路的人'];
const $=i=>document.getElementById(i);
const loc=Intl.DateTimeFormat().resolvedOptions().timeZone,diff=loc!==TZ;
const fm=(t,z)=>new Intl.DateTimeFormat('zh-TW',{timeZone:z,month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).format(t);
const ep=(d,h)=>new Date(d+'T'+h+':00+08:00');
function mp(keys,col,w){let s='<svg viewBox="0 0 360 260"><rect width="360" height="260" fill="none"/>';
(w||[[keys,col]]).forEach(([k,c],i)=>{const p=k.map(x=>P[x]);s+='<polyline filter="url(#w)" fill="none" stroke="'+c+'" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 3" points="'+p.map(a=>(a[2]+i*2)+','+(a[3]+i*2)).join(' ')+'"/>'});
const seen={};(w?Object.keys(P):keys).forEach(k=>{if(seen[k])return;seen[k]=1;const a=P[k];s+='<circle cx="'+a[2]+'" cy="'+a[3]+'" r="4" fill="var(--card)" stroke="var(--fg)" stroke-width="1.5"/><text x="'+(a[2]+7)+'" y="'+(a[3]+3)+'">'+(k==='hot'?'★ ':'')+a[0]+'</text>'});
return s+'</svg>'}
$('ov').innerHTML=mp(0,0,D.map(x=>[x.r,x.c]));
$('lg').innerHTML=D.map(x=>'<span><i style="background:'+x.c+'"></i>'+x.n.split('・')[0]+'</span>').join('');
$('bk').innerHTML=BK.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>').join('');
const all=[];
$('days').innerHTML=D.map(x=>{x.e.forEach(v=>all.push({t:ep(x.d,v[0]),v}));
const ks=x.r,nm=k=>P[k][1],wp=ks.slice(1,-1).slice(0,9).map(nm).join('|');
const nav='https://www.google.com/maps/dir/?api=1&travelmode=transit&origin='+encodeURIComponent(nm(ks[0]))+'&destination='+encodeURIComponent(nm(ks[ks.length-1]))+(wp?'&waypoints='+encodeURIComponent(wp):'');
return '<div class="dh"><b style="background:'+x.c+'"></b><h2 style="margin:0">'+x.n+'</h2></div><details><summary>展開當日路線地圖</summary><div style="padding:0 12px 12px"><div class="map">'+mp(ks,x.c)+'</div><a class="btn" href="'+nav+'">一鍵開啟全天導航（Google 地圖）</a></div></details><ul class="ev card" style="padding:4px 14px">'+x.e.map(v=>{const t=ep(x.d,v[0]);return '<li><time>'+v[0]+'<small>台北'+(diff?'<br>本地 '+fm(t,loc).split(' ').pop():'')+'</small></time><div>'+(v[2]?'<a href="'+G(v[2])+'">'+v[1]+'</a>':v[1])+(v[4]==='b'?'<span class="tag">須提前訂票</span>':v[4]==='ok'?'<span class="tag ok">已確認</span>':'')+(v[3]?'<div class="n">'+v[3]+'</div>':'')+'</div></li>'}).join('')+'</ul>'}).join('');
$('td').innerHTML=TD.map(x=>'<li>'+x+'</li>').join('');
$('fd').innerHTML=FD.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1].map(v=>'<div style="margin:3px 0"><a href="'+G(v[1])+'">'+v[0]+'</a>'+(v[3]?'<span class="tag ok">已排入</span>':'')+(v[2]?'<div class="n">'+v[2]+'</div>':'')+'</div>').join('')+'</td></tr>').join('');
$('tp').innerHTML=TP.map(x=>'<li>'+x+'</li>').join('');
function tick(){const n=new Date(),nx=all.find(a=>a.t>n);
if(!nx){$('nt').textContent='旅程結束，歡迎回家';$('cd').textContent='';$('ntm').textContent='';return}
let s=Math.floor((nx.t-n)/1000);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),c=s%60;
$('nt').textContent=nx.v[1];
$('cd').innerHTML=d+'<small>天</small>'+h+'<small>時</small>'+m+'<small>分</small>'+c+'<small>秒</small>';
$('ntm').textContent='台北時間 '+fm(nx.t,TZ)+'（UTC+8）'+(diff?'｜你的本地時間 '+fm(nx.t,loc)+'（'+loc+'）':'')}
tick();setInterval(tick,1000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
